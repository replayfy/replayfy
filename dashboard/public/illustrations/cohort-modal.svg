      <circle cx="445" cy="92" r="5" fill="#B39DF2" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="453" cy="92" r="5" fill="#8FD0B4" stroke="#FFFFFF" stroke-width="1.5"/>
