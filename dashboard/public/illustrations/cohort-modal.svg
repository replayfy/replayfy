    <circle cx="328" cy="37" r="4.5" fill="#6D9BFF"/>
    <circle cx="352" cy="35" r="4.5" fill="#7580F5"/>
    <circle cx="308" cy="58" r="4.5" fill="#B39DF2"/>
    <circle cx="328" cy="57" r="4.5" fill="#B9C4DC"/>
    <circle cx="349" cy="56" r="4.5" fill="#A98FF2"/>
    <circle cx="306" cy="73" r="4.5" fill="#8FD0B4"/>
    <circle cx="329" cy="79" r="4.5" fill="#6FC8A4"/>
