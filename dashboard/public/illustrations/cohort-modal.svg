<svg width="520" height="140" viewBox="0 0 520 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-cohort-modal" style="display:block;width:100%;height:auto">
  <title id="title-cohort-modal">Users sorted into one audience</title>
  <!-- Replayfy Illustration System · Modal header — Add to cohort · hand-crafted SVG -->

  <defs>
    <radialGradient id="chm-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3D4A6B" stop-opacity="0.16"/>
      <stop offset="0.65" stop-color="#3D4A6B" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#3D4A6B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chm-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6FB"/>
    </linearGradient>
    <!-- Dissolves the band into the modal surface: no hard edge under the title. -->
    <linearGradient id="chm-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
