    <path d="M490 20v12M484 26h12" stroke="#D5CBF7" stroke-width="2.5"/>
    <circle cx="500" cy="64" r="3" fill="#CBE8DC"/>
    <circle cx="24" cy="70" r="2.5" fill="#D9E2F5"/>
