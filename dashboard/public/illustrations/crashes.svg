<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-crashes">
  <title id="title-crashes">Crashlytics — crashes, handled exceptions and UI freezes, grouped and ranked by impact</title>
  <!-- Replayfy Illustration System · 08 Crashlytics · hand-crafted SVG -->
  <!--
    STORY: the hero is a CRASH-GROUPS REPORT — the product's actual job, not an
    icon. Rows are ranked by impact (the impact bar's LENGTH is the rank), the
    top group carries the workspace attention-amber (#F0A45C — attention, not
    catastrophe; same amber as alerts.svg / network-error.svg), the rest fall to
    indigo then grey as impact drops. A crash-free RING states stability up top;
    a shield in the header carries Crashlytics' own mark. Behind: a stack-trace
    card (the crashing frame amber-ticked) and a release card. A session chip
    says every crash is one click from where it happened. The cat mascot is
    reused byte-for-byte from the set, watching the report.

    No red: crashes are serious, but the file speaks in the system's amber, so
    it sits beside recordings/users/alerts as one family. Copy is added in code
    (system rule: no <text> in the SVG).
  -->

  <defs>
    <radialGradient id="cr-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9EEFA" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#EDF1FA" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#EDF1FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cr-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3D4A6B" stop-opacity="0.16"/>
      <stop offset="0.65" stop-color="#3D4A6B" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#3D4A6B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cr-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6FB"/>
    </linearGradient>
    <linearGradient id="cr-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D9BFF"/>
      <stop offset="1" stop-color="#4066F0"/>
    </linearGradient>
    <linearGradient id="cr-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4B36C"/>
      <stop offset="1" stop-color="#EC9448"/>
    </linearGradient>
    <linearGradient id="cr-cat-indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E8BFA"/>
      <stop offset="1" stop-color="#5F6CEC"/>
    </linearGradient>
    <radialGradient id="cr-soft-indigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EDEFFF" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#EDEFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#EDEFFF" stop-opacity="0"/>
    </radialGradient>
    <path id="cr-ear" d="M -16 14 Q -20 17 -17.5 10 L -4.5 -14 Q 0 -21 4.5 -14 L 17.5 10 Q 20 17 16 14 Q 0 7 -16 14 Z"/>
    <clipPath id="cr-shield-clip"><path d="M0 -13 L11.5 -8.4 V1.2 C11.5 8.8 6.2 13.2 0 16.2 C-6.2 13.2 -11.5 8.8 -11.5 1.2 V-8.4 Z"/></clipPath>
  </defs>

  <style>
    /* One calm pulse on the top group's attention amber — the same "this is the
       one that matters" beat the rest of the set uses. Nothing bounces. */
    @keyframes cr-pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
    .cr-pulse { animation: cr-pulse 2.6s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) { .cr-pulse { animation: none } }
  </style>

  <g id="background">
    <ellipse cx="404" cy="316" rx="382" ry="262" fill="url(#cr-glow)"/>
    <g id="ambient-marks" stroke-linecap="round">
      <circle cx="98" cy="150" r="5" stroke="#C8D2ED" stroke-width="2.5"/>
      <path d="M714 118v14M707 125h14" stroke="#D5CBF7" stroke-width="2.5"/>
      <circle cx="686" cy="470" r="4" fill="#CBE8DC"/>
      <circle cx="128" cy="332" r="3.5" fill="#D9E2F5"/>
      <circle cx="724" cy="300" r="4.5" stroke="#D7DEF0" stroke-width="2.5"/>
      <path d="M150 486v11M144.5 491.5h11" stroke="#D9E2F5" stroke-width="2.2"/>
    </g>
  </g>

  <!-- ══ BEHIND: a stack-trace snippet (crashing frame amber-ticked) and a
       release card. Rotated, dimmed — context, not subject. ══ -->
  <g id="behind-cards">
    <g id="stacktrace-card" transform="rotate(-6 168 214)" opacity="0.92">
      <rect x="92" y="156" width="152" height="116" rx="14" fill="#FFFFFF" stroke="#E6EAF4" stroke-width="1.5"/>
      <!-- three dots -->
      <g fill="#DCE3F0"><circle cx="108" cy="172" r="3"/><circle cx="118" cy="172" r="3"/><circle cx="128" cy="172" r="3"/></g>
      <!-- crashing frame, amber-ticked -->
      <rect x="104" y="188" width="3.5" height="11" rx="1.75" fill="#F0A45C"/>
      <rect x="114" y="189" width="112" height="7.5" rx="3.75" fill="#B7C0D8"/>
      <!-- deeper frames, indented -->
      <g fill="#DCE3F0">
        <rect x="122" y="206" width="94" height="6.5" rx="3.25"/>
        <rect x="122" y="220" width="104" height="6.5" rx="3.25"/>
        <rect x="122" y="234" width="76" height="6.5" rx="3.25"/>
        <rect x="122" y="248" width="90" height="6.5" rx="3.25"/>
      </g>
    </g>

    <g id="release-card" transform="rotate(5 662 200)" opacity="0.92">
      <rect x="588" y="150" width="148" height="100" rx="14" fill="#FFFFFF" stroke="#E6EAF4" stroke-width="1.5"/>
      <!-- version pill -->
      <rect x="604" y="166" width="52" height="18" rx="9" fill="#EEF1FF"/>
      <rect x="613" y="172" width="34" height="6" rx="3" fill="#B9C2EE"/>
      <!-- a small platform trio + a per-release amber dot -->
      <circle cx="704" cy="175" r="4" fill="#F0A45C"/>
      <g fill="#E0E6F2">
        <rect x="604" y="200" width="118" height="6.5" rx="3.25"/>
        <rect x="604" y="216" width="90" height="6.5" rx="3.25"/>
        <rect x="604" y="232" width="104" height="6.5" rx="3.25"/>
      </g>
    </g>
  </g>

  <!-- ══ HERO: the crash-groups report, ranked by impact ══ -->
  <g id="report">
    <ellipse cx="416" cy="430" rx="220" ry="17" fill="url(#cr-shadow)"/>
    <rect x="200" y="112" width="432" height="300" rx="22" fill="url(#cr-panel)" stroke="#E3E8F3" stroke-width="1.5"/>

    <!-- header: shield mark · title · crash-free ring -->
    <g id="report-head">
      <g transform="translate(240 148)">
        <path d="M0 -13 L11.5 -8.4 V1.2 C11.5 8.8 6.2 13.2 0 16.2 C-6.2 13.2 -11.5 8.8 -11.5 1.2 V-8.4 Z" fill="url(#cr-cat-indigo)"/>
        <g clip-path="url(#cr-shield-clip)"><ellipse cx="0" cy="-11" rx="12" ry="7" fill="#FFFFFF" opacity="0.16"/></g>
        <!-- a small impact bolt = "crash" -->
        <path d="M1.5 -6.5 L-3.5 1 H0 L-1.5 6.5 L4 -1 H0.5 Z" fill="#EDEFFF"/>
      </g>
      <rect x="262" y="136" width="120" height="10" rx="5" fill="#CBD5E8"/>
      <rect x="262" y="153" width="74" height="7" rx="3.5" fill="#DFE5F2"/>

      <!-- crash-free ring: nearly full, indigo. The stability headline. -->
      <g id="crashfree" transform="translate(588 148)">
        <circle r="16" fill="none" stroke="#EAEEF7" stroke-width="4.5"/>
        <circle r="16" fill="none" stroke="url(#cr-accent)" stroke-width="4.5"
                stroke-linecap="round" pathLength="100" stroke-dasharray="94 100"
                transform="rotate(-90)"/>
        <circle r="3.2" fill="#4066F0"/>
      </g>
      <rect x="512" y="144" width="48" height="8" rx="4" fill="#DFE5F2"/>
    </g>

    <line x1="220" y1="180" x2="612" y2="180" stroke="#EDF1F8" stroke-width="1.5"/>

    <!-- crash-group rows. Impact bar LENGTH = rank. -->
    <g id="crash-rows">
      <!-- ① top group — attention amber, highlighted, darker name -->
      <rect x="212" y="196" width="408" height="40" rx="11" fill="#F0A45C" opacity="0.09"/>
      <rect class="cr-pulse" x="228" y="202" width="4" height="28" rx="2" fill="#F0A45C"/>
      <rect x="246" y="204" width="132" height="9" rx="4.5" fill="#2E3450"/>
      <rect x="246" y="219" width="86" height="6.5" rx="3.25" fill="#D6DEED"/>
      <rect x="424" y="212" width="128" height="7" rx="3.5" fill="#EBEFF7"/>
      <rect x="424" y="212" width="124" height="7" rx="3.5" fill="url(#cr-amber)"/>
      <rect x="566" y="205" width="50" height="22" rx="9" fill="#FBEEDD"/>
      <rect x="576" y="212" width="30" height="7" rx="3.5" fill="#E1A968"/>

      <!-- ② -->
      <rect x="228" y="248" width="4" height="26" rx="2" fill="#7E8BFA"/>
      <rect x="246" y="250" width="112" height="8.5" rx="4.25" fill="#B7C0D8"/>
      <rect x="246" y="264" width="72" height="6.5" rx="3.25" fill="#E0E6F2"/>
      <rect x="424" y="257" width="128" height="7" rx="3.5" fill="#EBEFF7"/>
      <rect x="424" y="257" width="92" height="7" rx="3.5" fill="#7E8BFA"/>
      <rect x="566" y="250" width="50" height="22" rx="9" fill="#F1F4FB"/>
      <rect x="576" y="257" width="30" height="7" rx="3.5" fill="#C3CBDE"/>

      <!-- ③ -->
      <rect x="228" y="292" width="4" height="26" rx="2" fill="#A9B4F5"/>
      <rect x="246" y="294" width="98" height="8.5" rx="4.25" fill="#B7C0D8"/>
      <rect x="246" y="308" width="64" height="6.5" rx="3.25" fill="#E0E6F2"/>
      <rect x="424" y="301" width="128" height="7" rx="3.5" fill="#EBEFF7"/>
      <rect x="424" y="301" width="64" height="7" rx="3.5" fill="#A9B4F5"/>
      <rect x="566" y="294" width="50" height="22" rx="9" fill="#F1F4FB"/>
      <rect x="576" y="301" width="24" height="7" rx="3.5" fill="#C7CEF8"/>

      <!-- ④ — impact tapering off, grey -->
      <rect x="228" y="336" width="4" height="26" rx="2" fill="#C7CEF8"/>
      <rect x="246" y="338" width="86" height="8.5" rx="4.25" fill="#C3CBDE"/>
      <rect x="246" y="352" width="58" height="6.5" rx="3.25" fill="#E7ECF5"/>
      <rect x="424" y="345" width="128" height="7" rx="3.5" fill="#EBEFF7"/>
      <rect x="424" y="345" width="40" height="7" rx="3.5" fill="#C7CEF8"/>
      <rect x="566" y="338" width="50" height="22" rx="9" fill="#F1F4FB"/>
      <rect x="576" y="345" width="20" height="7" rx="3.5" fill="#D5DCEA"/>
    </g>
  </g>

  <!-- one click from the session where it happened -->
  <g id="session-chip" transform="rotate(4 596 392)">
    <rect x="556" y="378" width="82" height="28" rx="14" fill="#FFFFFF" stroke="#E6EAF4" stroke-width="1.5"/>
    <circle cx="574" cy="392" r="9" fill="url(#cr-accent)"/>
    <path d="M571 388l6 4-6 4z" fill="#FFFFFF"/>
    <rect x="588" y="388" width="38" height="8" rx="4" fill="#DCE3F0"/>
  </g>

  <!-- ══ CAT — reused from the set, watching the report. ══ -->
  <g id="cat-hero" aria-label="Cat watching the crash report">
    <ellipse id="cat-shadow" cx="150" cy="588" rx="82" ry="12" fill="url(#cr-shadow)"/>
    <g transform="translate(150 452) rotate(2)">
      <g id="cat-tail">
        <path d="M32 106 C 66 116 88 106 92 82 C 94.5 68 82 64 79 76 C 76 90 62 98 36 94 Z" fill="#5F6CEC"/>
        <circle cx="86.5" cy="72" r="7" fill="#EDEFFF"/>
      </g>
      <g id="cat-ears">
        <g id="ear-left" transform="translate(-33 -45) rotate(-26)">
          <use href="#cr-ear" fill="#6874F0"/>
          <use href="#cr-ear" fill="#D9CFFF" transform="translate(0 -1.5) scale(0.52)"/>
        </g>
        <g id="ear-right" transform="translate(33 -45) rotate(26)">
          <use href="#cr-ear" fill="#6874F0"/>
          <use href="#cr-ear" fill="#D9CFFF" transform="translate(0 -1.5) scale(0.52)"/>
        </g>
      </g>
      <g id="cat-body">
        <path d="M-40 110 C -40 58 -22 34 0 34 C 22 34 40 58 40 110 C 40 124 28 130 0 130 C -28 130 -40 124 -40 110 Z" fill="url(#cr-cat-indigo)"/>
        <ellipse cx="0" cy="43" rx="23" ry="8" fill="#4A55CF" opacity="0.1"/>
        <ellipse cx="0" cy="94" rx="15" ry="21" fill="url(#cr-soft-indigo)"/>
        <g id="cat-paws">
          <rect x="-25" y="108" width="18" height="24" rx="9" fill="#EDEFFF"/>
          <rect x="7" y="108" width="18" height="24" rx="9" fill="#EDEFFF"/>
          <path d="M-19 125v5M-13 125v5M13 125v5M19 125v5" stroke="#C9CDF4" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>
      <g id="cat-head">
        <path d="M-52 4 C -52 -28 -30 -46 0 -46 C 30 -46 52 -28 52 4 C 52 32 28 48 0 48 C -28 48 -52 32 -52 4 Z" fill="url(#cr-cat-indigo)"/>
        <g id="cat-face" transform="translate(7 -6)">
          <ellipse cx="1" cy="16" rx="19" ry="11.5" fill="url(#cr-soft-indigo)"/>
          <ellipse cx="-18" cy="-6" rx="8" ry="10.5" fill="#262B45"/>
          <ellipse cx="20" cy="-6" rx="8" ry="10.5" fill="#262B45"/>
          <circle cx="-15" cy="-10" r="3" fill="#FFFFFF"/>
          <circle cx="23" cy="-10" r="3" fill="#FFFFFF"/>
          <circle cx="-21" cy="-2" r="1.2" fill="#FFFFFF" opacity="0.6"/>
          <circle cx="17" cy="-2" r="1.2" fill="#FFFFFF" opacity="0.6"/>
          <path d="M-3 10 L 5 10 Q 7.4 10.5 6 13 L 3 16.2 Q 1 17.8 -1 16.2 L -4 13 Q -5.4 10.5 -3 10 Z" fill="#3A3F5F"/>
          <path d="M1 17.5 Q 1 21 -2.6 21.8 M1 17.5 Q 1 21 4.6 21.8" stroke="#3A3F5F" stroke-width="1.7" stroke-linecap="round" fill="none"/>
          <ellipse cx="-30" cy="10" rx="6" ry="3.6" fill="#F19BB4" opacity="0.3"/>
          <ellipse cx="32" cy="10" rx="6" ry="3.6" fill="#F19BB4" opacity="0.3"/>
          <g id="whiskers" stroke="#4A55CF" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
            <path d="M-33 6 L -50 2"/>
            <path d="M-33 12 L -49 12"/>
            <path d="M37 6 L 53 2"/>
            <path d="M37 12 L 52 12"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
