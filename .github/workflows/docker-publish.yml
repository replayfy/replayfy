name: Publish Docker images

# Build the server + dashboard images and push them to the GitHub Container
# Registry so users can `docker pull` instead of building from source. Runs on
# every push to main, on version tags (v1.2.3 → semver tags), and on demand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: ./server
          - image: dashboard
            context: ./dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version baked into the image (surfaced at GET /version). A release tag
      # (v1.2.3) → 1.2.3; a main build → the package version + a -dev.<sha> suffix
      # so it's never mistaken for a release.
      - name: Resolve build metadata
        id: build
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./server/package.json').version")-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.time }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Cut a GitHub Release (with auto-generated notes) whenever a version tag is
  # pushed — the images for it are built by the job above.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
